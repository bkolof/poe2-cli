# Build and test on every system the releases target. The integration tests
# run against the real pinned PoB, which the first command downloads.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Cache Path of Building
        uses: actions/cache@v4
        with:
          # The local data directory on Linux, macOS and Windows.
          path: |
            ~/.local/share/poe2/pob
            ~/Library/Application Support/poe2/pob
            ~/AppData/Local/poe2/pob
          key: pob-${{ runner.os }}-${{ hashFiles('src/pob/install.rs') }}
      - name: Check formatting and lints
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Install Path of Building and calculate the test build
        run: cargo run -- stats tests/fixtures/koftespies.pob
      - run: cargo test
