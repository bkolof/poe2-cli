[package]
name = "poe2"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.10"
mlua = { version = "0.12.1", features = ["luajit", "vendored", "serialize", "send"] }
open = "5.4.4"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
ureq = { version = "3.4.2", features = ["json"] }

[build-dependencies]
cc = "1.5.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
